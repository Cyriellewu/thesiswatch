name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: pytest (offline)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    env:
      # AlphaWatch's core is offline-testable: no network, no keys, no live market.
      ALPHAWATCH_OFFLINE: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run tests (engine + API contract)
        # Includes tests/test_api_contract.py (FastAPI TestClient) so the API
        # envelope contract is proven, not just engine units.
        run: python -m pytest -q

  frontend-build:
    name: frontend build + typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build (tsc -b + vite build)
        # `npm run build` runs `tsc -b` (typecheck) then `vite build`; a type
        # error or a broken import fails the build.
        run: npm run build

  e2e:
    name: e2e smoke (Playwright)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run smoke tests
        # Self-contained: the Playwright config starts the Vite dev server and
        # the tests use Demo mode + route-abort, so no backend API is required.
        # Proves: demo loads Today -> ThesisDetail; live failure -> honest
        # "unavailable" with NO mock content.
        run: npm run test:e2e
