name: Bug report
description: Report something that behaves incorrectly (wrong status, bad delta, crash, stale/partial data handled poorly).
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping keep AlphaWatch honest.

        **Please do not paste real holdings, theses, API keys, or `.env` contents.**
        AlphaWatch is local-first: reproduce with the sample portfolio
        (`config/watchlist.example.yaml`) and `ALPHAWATCH_OFFLINE=1` where possible.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did AlphaWatch show or do, and what did you expect instead?
      placeholder: |
        e.g. NVDA showed 🟢 No action, but an invalidation condition should have fired and moved it to 🟠 Re-evaluate.
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Affected area
      description: Which part of the engine/app is involved?
      options:
        - Thesis ledger / confidence
        - Thesis Delta ("what changed")
        - Status engine (No action / Watch / Re-evaluate)
        - Why-changed factor attribution / Evidence sheet
        - Conviction / focus ranking
        - Exposure / what-if simulation
        - Investment Committee
        - Decision history
        - Data layer (quotes / news / macro / gurus)
        - UI (Streamlit tabs)
        - Other
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Minimal steps. Prefer the offline demo so others can reproduce.
      placeholder: |
        1. ALPHAWATCH_OFFLINE=1 python -m streamlit run ui/app.py
        2. Open the ... tab
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Python version, and whether you ran offline.
      placeholder: |
        OS: Windows 11
        Python: 3.11
        Mode: ALPHAWATCH_OFFLINE=1 (offline demo)
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs / traceback
      description: Paste the stack trace or the failing `pytest -q` output. Redact anything private.
      render: shell

  - type: checkboxes
    id: privacy
    attributes:
      label: Confirmation
      options:
        - label: I did not include any real holdings, theses, API keys, or secrets.
          required: true
        - label: I reproduced (or tried to reproduce) with the sample portfolio / offline mode.
          required: false
